[project]
name = "leadflow-ai"
version = "0.6.0"
description = "LeadFlow AI: lead validation, local SQLite storage, CSV import, rule-based scoring, lead lifecycle, reviewed response drafts with a simulated outbox, and an operator REST API."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.20,<1.21",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1,<2.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",  # used by starlette.testclient; plain httpx is deprecated there
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadflow_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src/leadflow_ai --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["src/leadflow_ai"]
