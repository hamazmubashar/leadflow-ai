# LeadFlow AI production stack (M12). Only Caddy is reachable from outside; it serves
# the dashboard over HTTPS. The API has no published port.
#
#   cp deploy/production.env.example deploy/production.env    # then edit it
#   docker compose up -d --build
#   docker compose run --rm api python -m leadflow_ai.manage_users create yourname --role admin

x-hardening: &hardening
  restart: unless-stopped
  read_only: true            # the image is immutable; only the volumes below are writable
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  api:
    <<: *hardening
    build: .
    image: leadflow-ai:latest
    # Its own file, so a developer's .env (local URLs, a local model) never leaks in.
    env_file: deploy/production.env
    volumes:
      - leadflow-data:/data
    # --forwarded-allow-ips='*' is safe only because port 8000 is never published:
    # just Caddy and the dashboard can reach it, on the internal network.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dashboard:
    <<: *hardening
    image: leadflow-ai:latest
    pull_policy: never         # built locally by the api service, never downloaded
    depends_on:
      api: {condition: service_healthy}
    environment:
      LEADFLOW_API_URL: http://api:8000
      LEADFLOW_TRUST_PROXY: "true"
      HOME: /tmp                 # Streamlit writes a small config folder under $HOME
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --server.fileWatcherType=none
      - --browser.gatherUsageStats=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    <<: *hardening
    image: leadflow-ai:latest
    pull_policy: never
    depends_on:
      api: {condition: service_healthy}
    command: ["python", "-m", "leadflow_ai.db.backup", "--to", "/backups", "--keep", "7", "--every-hours", "24"]
    volumes:
      - leadflow-data:/data     # read-write: SQLite needs it to read a WAL database safely
      - leadflow-backups:/backups

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      dashboard: {condition: service_healthy}
    ports:
      - "80:80"
      - "443:443"
    env_file: deploy/production.env   # for LEADFLOW_DOMAIN
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  leadflow-data:
  leadflow-backups:
  caddy-data:
  caddy-config:
